<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d24400">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>Kookboek</title>
</head>
<body>
  <header>
    <a href="#/" class="title">🍳 Kookboek</a>
    <div class="hdr">
      <span id="syncStatus" class="muted"></span>
      <button id="shopBtn" class="btn" type="button" title="Boodschappen (schermvullend, om in de winkel af te vinken)">🛒</button>
      <button id="syncBtn" class="btn" type="button" data-state="idle" title="Synchroniseren met Google Drive" aria-label="Synchroniseren met Google Drive"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M6.5 19a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 17.4 9.1 4.9 4.9 0 0 1 17.5 19z"/><path class="tick" d="M8.8 14.2l2.4 2.4 4.2-4.6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="importBtn" class="btn" type="button" title="Recepten importeren">📥<span class="lbl"> Importeren</span></button>
      <button id="settingsBtn" class="btn" type="button" title="Instellingen en back-up">⚙</button>
      <a href="#/edit/new" class="btn primary">+ Nieuw</a>
    </div>
  </header>
  <main id="app" class="wide"></main>
  <script type="module" src="app.js"></script>
</body>
</html>
